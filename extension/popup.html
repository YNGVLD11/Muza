<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Muza</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Top Header -->
    <header class="header">
      <div class="logo-group">
        <img src="icons/icon48.png" class="logo-icon" alt="Muza">
        <span class="logo-text">Muza</span>
      </div>
      <div class="header-actions">
        <span id="host-status-dot" class="status-dot offline" title="Статус хоста"></span>
        <button id="btn-open-settings" class="icon-button" title="Настройки">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="content">
      <!-- State 1: Host Offline -->
      <section id="view-host-offline" class="view hidden">
        <div class="card offline-card">
          <p class="card-title">Хост не подключен</p>
          <p class="card-desc">Запустите <code>start_host.bat</code> на компьютере для работы расширения.</p>
          <button id="btn-retry-host" class="btn btn-secondary">Проверить снова</button>
        </div>
      </section>

      <!-- State 2: No Media Detected -->
      <section id="view-no-media" class="view hidden">
        <div class="card empty-card">
          <p class="card-title">Видео не обнаружено</p>
          <p class="card-desc">Откройте страницу видео на YouTube или вставьте ссылку ниже:</p>
          <div class="input-row">
            <input type="text" id="manual-url-input" class="text-input" placeholder="Вставьте ссылку на YouTube...">
            <button id="btn-manual-submit" class="btn btn-primary btn-inline">ОК</button>
          </div>
        </div>
      </section>

      <!-- State 3: Media Detected -->
      <section id="view-media" class="view hidden">
        <div class="media-card">
          <div class="thumbnail-wrapper">
            <img id="media-thumbnail" src="" alt="Обложка" class="media-thumb">
          </div>
          <div class="media-info">
            <p id="media-title" class="media-title">Загрузка информации...</p>
          </div>
        </div>

        <!-- Bitrate Selector -->
        <div class="selector-row">
          <label class="selector-label">Битрейт:</label>
          <div class="bitrate-pills">
            <button class="pill" data-bitrate="128">128K</button>
            <button class="pill" data-bitrate="192">192K</button>
            <button class="pill" data-bitrate="256">256K</button>
            <button class="pill active" data-bitrate="320">320K</button>
          </div>
        </div>

        <!-- Action / Progress Container -->
        <div id="action-container" class="action-section">
          <!-- Button State: Idle -->
          <button id="btn-download" class="btn btn-primary btn-full">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            <span>Скачать MP3</span>
          </button>

          <!-- Progress State: Downloading / Converting -->
          <div id="progress-container" class="progress-box hidden">
            <div class="progress-bar-bg">
              <div id="progress-fill" class="progress-bar-fill" style="width: 0%;"></div>
            </div>
            <p id="progress-status-text" class="progress-text">Подготовка...</p>
          </div>

          <!-- Complete State: Open in Explorer -->
          <button id="btn-open-folder" class="btn btn-secondary btn-full hidden">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
            </svg>
            <span>Открыть в папке</span>
          </button>
        </div>
      </section>
    </main>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay hidden">
      <div class="modal-card">
        <div class="modal-header">
          <p class="modal-title">Настройки</p>
          <button id="btn-close-settings" class="icon-button">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <div class="modal-body">
          <div class="form-group">
            <label class="form-label">Папка для сохранения:</label>
            <div class="input-row">
              <input type="text" id="settings-path-input" class="text-input" placeholder="C:\Путь\К\Папке">
              <button id="btn-save-path" class="btn btn-primary btn-inline" title="Сохранить путь">ОК</button>
            </div>
            <button id="btn-browse-folder" class="btn btn-secondary btn-full btn-small">Выбрать через проводник</button>
            <p id="path-save-status" class="update-info"></p>
          </div>

          <div class="form-group">
            <label class="form-label">Обновления:</label>
            <button id="btn-check-updates" class="btn btn-secondary btn-full btn-small">Проверить обновления</button>
            <p id="update-status" class="update-info"></p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
