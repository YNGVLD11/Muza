<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Muza</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="app-container">
    <!-- Top Header -->
    <header class="header">
      <div class="logo-group">
        <img src="icons/icon48.png" class="logo-icon" alt="Muza">
        <span class="logo-text">Muza</span>
      </div>
      <div class="header-actions">
        <span id="host-status-dot" class="status-dot offline" title="Статус хоста"></span>
        <button id="btn-open-settings" class="icon-button" title="Настройки">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="content">
      <!-- State 1: Host Offline / Not Installed -->
      <section id="view-host-offline" class="view hidden">
        <div class="card offline-card">
          <div class="offline-icon-wrap">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect>
              <rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect>
              <line x1="6" y1="6" x2="6.01" y2="6"></line>
              <line x1="6" y1="18" x2="6.01" y2="18"></line>
            </svg>
          </div>
          <p class="card-title">Хост не подключен</p>
          <p class="card-desc">Выполните один раз <code>install.bat</code> в папке <code>host-windows</code> для привязки к браузеру.</p>
          <div class="offline-actions">
            <button id="btn-retry-host" class="btn btn-primary btn-full">Проверить подключение</button>
          </div>
          <p id="host-launch-hint" class="update-info"></p>
        </div>
      </section>

      <!-- State 2: Active Main Screen -->
      <section id="view-main" class="view">
        <!-- Top URL Input with Submit Arrow -->
        <div class="url-input-container">
          <div class="input-wrapper">
            <input type="text" id="url-input" class="search-input" placeholder="Вставьте ссылку на YouTube...">
            <button id="btn-submit-url" class="input-action-btn" title="Добавить в очередь">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </button>
          </div>
        </div>

        <!-- Bitrate Selector -->
        <div class="selector-row">
          <span class="selector-label">Битрейт:</span>
          <div class="bitrate-pills">
            <button class="pill" data-bitrate="128">128K</button>
            <button class="pill" data-bitrate="192">192K</button>
            <button class="pill" data-bitrate="256">256K</button>
            <button class="pill active" data-bitrate="320">320K</button>
          </div>
        </div>

        <!-- Big Main Action Button -->
        <div id="main-action-wrap">
          <button id="btn-main-action" class="btn btn-primary btn-full">
            <svg id="main-btn-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            <span id="main-btn-text">Скачать MP3</span>
          </button>
        </div>

        <!-- Queue Section Header -->
        <div class="queue-header">
          <span id="queue-title" class="queue-title-text">Очередь (0)</span>
          <button id="btn-clear-queue" class="text-action-btn" title="Очистить всю очередь">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
            <span>Очистить</span>
          </button>
        </div>

        <!-- Queue Items Container -->
        <div id="queue-list" class="queue-list"></div>

        <!-- Empty Queue State -->
        <div id="queue-empty" class="queue-empty-box hidden">
          <p class="empty-title">Очередь пуста</p>
          <p class="empty-desc">Откройте видео на YouTube или вставьте ссылку в поле выше</p>
        </div>
      </section>
    </main>

    <!-- Settings Modal -->
    <div id="settings-modal" class="modal-overlay hidden">
      <div class="modal-card">
        <div class="modal-header">
          <p class="modal-title">Настройки</p>
          <button id="btn-close-settings" class="icon-button">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <div class="modal-body">
          <div class="form-group">
            <label class="form-label">Папка для сохранения:</label>
            <input type="text" id="settings-path-input" class="text-input" placeholder="C:\Путь\К\Папке" readonly>
            <button id="btn-browse-folder" class="btn btn-secondary btn-full btn-small">Выбрать через проводник</button>
          </div>

          <div class="form-group">
            <label class="form-label">Обновления:</label>
            <button id="btn-check-updates" class="btn btn-secondary btn-full btn-small">Проверить обновления</button>
            <p id="update-status" class="update-info"></p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
